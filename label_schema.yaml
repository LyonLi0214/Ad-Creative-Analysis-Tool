# Label Schema — 素材拆解分析库 (NocoDB 版)
# 基于黑帮项目的四维拆解框架 + 6维标签体系适配
# ============================================================================

game: 通用
version: 1
description: "游戏海外市场营销素材标签体系（适配 NocoDB 表结构）"

# ---------------------------------------------------------------------------
# 6 维标签（映射到 NocoDB ai_analysis 表的列）
# ---------------------------------------------------------------------------
dimensions:
  # → NocoDB 列: 开头策略
  hook_策略:
    description: "素材的钩子策略——用什么方式吸引用户注意并点击"
    nocodb_column: "开头策略"
    values:
      - name: 反常识标题
        desc: "用反常识/信息差制造悬念，吸引点击（如'别选XX''99%的人不知道'）"
      - name: 教学攻略
        desc: "教用户怎么玩/阵容推荐，提供实用价值"
      - name: 福利展示
        desc: "突出免费福利/抽卡资源，制造紧迫感"
      - name: 擦边/角色吸引
        desc: "用角色立绘/身材/性感元素筛选目标用户"
      - name: 剧情/抓马
        desc: "用短剧情如逆袭/被嘲笑/狗血情节吸引追看"
      - name: 口播推荐
        desc: "真人口播或AI虚拟人口播开头推荐，建立信任感"
      - name: 问题型标题
        desc: "抛出问题引发好奇（如'你还在用XX？'）"
      - name: 选择互动
        desc: "通过选择/选项引导剧情走向，模拟互动"
      - name: 福利激励
        desc: "转盘抽奖/签到/登录送福利"
      - name: 核心玩法展示
        desc: "直接展示游戏核心玩法画面"
      - name: 来电钩子
        desc: "以来电/消息通知作为开场钩子"
      - name: 定制互动
        desc: "强调用户可定制外观/剧情走向"
      - name: 噱头/爆点
        desc: "以噱头/爆点内容吸引注意力"

  # → NocoDB 列: 角色元素
  角色元素:
    description: "素材中出现的角色类型或特征"
    nocodb_column: "角色元素"
    values:
      - name: 黑皮
        desc: "深色皮肤角色展示"
      - name: 猫耳/兽耳
        desc: "猫耳/兽耳角色展示"
      - name: Q版角色
        desc: "Q版像素/Q版小人角色"
      - name: 秘书/职场
        desc: "职场/秘书装扮角色"
      - name: 多角色
        desc: "多个角色同时展示或快速切换"
      - name: 立绘展示
        desc: "角色大立绘/特写镜头"
      - name: 真人出镜
        desc: "真人出镜拍摄"
      - name: AI虚拟人
        desc: "AI生成的虚拟人物"
      - name: 无角色
        desc: "纯游戏画面/无角色特写"

  # → NocoDB 列: （新增到 AI原始输出 JSON 中）
  场景元素:
    description: "素材中出现的主要场景类型"
    nocodb_column: null  # 存入 AI原始输出
    values:
      - name: 弹球/战斗
        desc: "核心战斗/弹球画面"
      - name: 选择界面
        desc: "角色选择/阵容搭配界面"
      - name: 养成界面
        desc: "升级/技能强化界面"
      - name: Boss战
        desc: "Boss出场/Boss战斗画面"
      - name: 胜利结算
        desc: "通关/胜利/奖励掉落画面"
      - name: 福利界面
        desc: "抽卡/签到/奖励展示界面"
      - name: 模拟UI
        desc: "模拟聊天/约会软件/游戏界面"
      - name: 直播间
        desc: "模拟直播场景"

  # → NocoDB 列: （新增到 AI原始输出 JSON 中）
  制作方式:
    description: "素材的制作方法和风格"
    nocodb_column: null  # 存入 AI原始输出
    values:
      - name: K帧动画
        desc: "关键帧动画（手绘/逐帧）"
      - name: 扒改
        desc: "扒取其他素材改编/二创"
      - name: 真人口播
        desc: "真人出镜口播拍摄"
      - name: AI口播
        desc: "AI虚拟人/语音合成口播"
      - name: 实机录屏
        desc: "真实游戏录屏画面"
      - name: 图片轮播
        desc: "静态图片+转场动画拼接"
      - name: 混合
        desc: "多种制作方式混合"

  # → NocoDB 列: 文案角度
  叙事模式:
    description: "素材的故事/叙事结构"
    nocodb_column: "文案角度"
    values:
      - name: 问题-解法
        desc: "抛出问题→展示解法→验证成功"
      - name: 反差逆袭
        desc: "弱者被嘲笑→变强打脸逆袭"
      - name: 攻略教学
        desc: "Step-by-step教玩法/阵容搭配"
      - name: 角色推荐
        desc: "推荐某个角色→展示角色强度/魅力"
      - name: 悬念-揭秘
        desc: "制造悬念→逐步揭示→爽点释放"
      - name: 福利直给
        desc: "直接展示福利/奖励不铺垫"
      - name: 选项驱动
        desc: "通过选择/选项引导剧情走向"
      - name: 定制互动
        desc: "强调用户可定制外观/剧情"
      - name: 擦边吸引
        desc: "以擦边/性暗示内容吸引"
      - name: 角色展示
        desc: "以角色立绘/自我介绍为主"
      - name: 聊天模拟
        desc: "模拟聊天/约会软件对话"
      - name: 口播推荐
        desc: "真人/AI口播直接推荐"

  # → NocoDB 列: 视觉风格
  画面风格:
    description: "素材的整体视觉风格"
    nocodb_column: "视觉风格"
    values:
      - name: 二次元精致渲染
        desc: "日系二次元，高细节，通透光影"
      - name: Q版可爱风
        desc: "Q版角色/像素风，轻松可爱感"
      - name: AI合成
        desc: "AI生成/合成画面风格"
      - name: 实机录屏
        desc: "直接录屏/截图拼接的原始风格"
      - name: 实拍
        desc: "真人实拍画面"
      - name: 混剪
        desc: "多种风格混合剪辑"
      - name: 游戏录屏
        desc: "游戏画面录制"
      - name: 图文
        desc: "静态图文排版"

# ---------------------------------------------------------------------------
# hook_type → hook_策略 映射（兼容黑帮项目 31 种分类）
# ---------------------------------------------------------------------------
hook_type_mapping:
  "AI口播": "口播推荐"
  "真人口播": "口播推荐"
  "口播推荐": "口播推荐"
  "福利激励": "福利展示"
  "送福利": "福利展示"
  "转盘抽奖": "福利激励"
  "福利": "福利展示"
  "擦边": "擦边/角色吸引"
  "约会软件": "擦边/角色吸引"
  "角色吸引": "擦边/角色吸引"
  "擦边+核心内容": "擦边/角色吸引"
  "教学攻略": "教学攻略"
  "教程类": "教学攻略"
  "核心内容": "核心玩法展示"
  "核心玩法": "核心玩法展示"
  "剧情": "剧情/抓马"
  "剧情 + 选择": "选择互动"
  "选择": "选择互动"
  "选择+好感度": "选择互动"
  "立绘 + 选择": "选择互动"
  "来电 + 擦边 + 选择": "来电钩子"
  "好感度解锁": "定制互动"
  "定制 + 互动": "定制互动"
  "定制+福利口播": "福利激励"
  "定制外观+聊天": "定制互动"
  "撕衣服": "擦边/角色吸引"
  "跳舞+口播": "擦边/角色吸引"
  "跳舞 + 福利口播": "福利激励"
  "直播间": "核心玩法展示"
  "聊天展示": "定制互动"
  "拼图": "核心玩法展示"
  "换装+福利": "福利展示"
  "立绘": "擦边/角色吸引"
  "立绘自我介绍": "擦边/角色吸引"
  "噱头": "噱头/爆点"
  "互动": "选择互动"
  "仿游戏界面": "核心玩法展示"
  "新闻+核心内容": "核心玩法展示"
  "解锁新场景": "核心玩法展示"
  "价格锚点": "反常识标题"

# ---------------------------------------------------------------------------
# 四维拆解框架（用于 prompt 指导）
# ---------------------------------------------------------------------------
breakdown_framework:
  维度1_钩子:
    description: "前3秒·钩子：视觉冲击 / 听觉锚点 / 文案悬念"
    focus: "素材开头用了什么方式抓住注意力？前3秒发生了什么？"
  维度2_主体:
    description: "核心卖点·主体：玩法展示 / 心理诉求 / 角色情感"
    focus: "素材主体展示了什么核心内容？卖点是什么？"
  维度3_视听:
    description: "视听语言·包装：节奏设计 / 风格调性 / 文化适配"
    focus: "画面风格、BGM、节奏如何？适合什么文化市场？"
  维度4_CTA:
    description: "转化路径·CTA：类型 / 文案 / 位置"
    focus: "素材结尾如何引导转化？CTA是什么？"
